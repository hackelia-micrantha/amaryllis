name: Node.js Compatibility Matrix

on:
  pull_request:
    branches:
      - main
      - feature/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-compat:
    runs-on: runner-amaryllis
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '20.x'
            nix-shell: node20
          - node-version: '22.x'
            nix-shell: node22
          - node-version: '24.x'
            nix-shell: node24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nix-shell: ${{ matrix.nix-shell }}

      - name: Verify Node version
        env:
          NIX_SHELL: ${{ matrix.nix-shell }}
        run: |
          actual_major="$(nix develop ".#${NIX_SHELL}" --command node --version | sed -E 's/^v([0-9]+).*/\1/')"
          expected_major="${{ matrix.node-version }}"
          expected_major="${expected_major%%.*}"
          test "$actual_major" = "$expected_major"

      - name: Run tests
        env:
          NIX_SHELL: ${{ matrix.nix-shell }}
        run: nix develop ".#${NIX_SHELL}" --command corepack yarn test --maxWorkers=2

      - name: Run typecheck
        env:
          NIX_SHELL: ${{ matrix.nix-shell }}
        run: nix develop ".#${NIX_SHELL}" --command corepack yarn typecheck
