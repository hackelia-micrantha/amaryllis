name: SBOM

on:
  pull_request:
    branches:
      - main
      - feature/*
    paths:
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - example/package.json
      - packages/*/package.json
      - android/**
      - ios/**
      - '*.podspec'
      - '**/Podfile.lock'
      - '**/Package.resolved'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/libs.versions.toml'
      - scripts/validate-sbom.sh
      - .github/actions/setup/**
      - .github/workflows/sbom.yml
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          syft-version: v1.42.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM contract
        run: bash scripts/validate-sbom.sh artifacts/sbom.cdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amaryllis-sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  dependency-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.42.0
          dependency-snapshot: true
          upload-artifact: false
          upload-release-assets: false

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Generate release CycloneDX SBOM
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/amaryllis-${{ github.ref_name }}.cdx.json
          syft-version: v1.42.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate release SBOM contract
        run: bash scripts/validate-sbom.sh "artifacts/amaryllis-${GITHUB_REF_NAME}.cdx.json"

      - name: Publish SBOM release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "artifacts/amaryllis-${GITHUB_REF_NAME}.cdx.json"
          --clobber
