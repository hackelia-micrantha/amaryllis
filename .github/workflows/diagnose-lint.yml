name: Diagnose lint

on:
  push:
    branches:
      - issues/62-request-scoped-async
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Capture lint output
        continue-on-error: true
        run: |
          yarn lint --ignore-pattern 'packages/amaryllis-components/**' > lint-diagnostic.log 2>&1

      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostic
          path: lint-diagnostic.log
          if-no-files-found: error
          retention-days: 1
