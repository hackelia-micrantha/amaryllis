name: CI
on:
  push:
    branches:
      - feature/*
      - main
  pull_request:
    branches:
      - feature/*
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_root: ${{ steps.classify.outputs.run_root }}
      run_components: ${{ steps.classify.outputs.run_components }}
      run_native: ${{ steps.classify.outputs.run_native }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test change classification
        run: |
          node --test \
            scripts/ci-workflow-contract.test.mjs \
            scripts/classify-ci-changes.test.mjs \
            scripts/detect-ci-changes.test.mjs

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo "run_root=true"
              echo "run_components=true"
              echo "run_native=true"
              echo "reason=non-pull-request event; running all CI validation"
              echo "changed_count=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## CI change classification"
              echo
              echo "- Root validation: **run**"
              echo "- Components validation: **run**"
              echo "- Native matrix: **run**"
              echo "- Reason: non-pull-request event; running all CI validation"
              echo "- Changed paths: not evaluated"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/detect-ci-changes.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Root validation not required for this change
        if: needs.changes.outputs.run_root != 'true'
        run: |
          echo "Root validation skipped: ${{ needs.changes.outputs.reason }}"

      - name: Checkout
        if: needs.changes.outputs.run_root == 'true'
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.run_root == 'true'
        uses: ./.github/actions/setup

      - name: Lint root package
        if: needs.changes.outputs.run_root == 'true'
        run: yarn lint --ignore-pattern 'packages/amaryllis-components/**'

      - name: Typecheck files
        if: needs.changes.outputs.run_root == 'true'
        run: yarn typecheck

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Root tests not required for this change
        if: needs.changes.outputs.run_root != 'true'
        run: |
          echo "Root tests skipped: ${{ needs.changes.outputs.reason }}"

      - name: Checkout
        if: needs.changes.outputs.run_root == 'true'
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.run_root == 'true'
        uses: ./.github/actions/setup

      - name: Run unit tests
        if: needs.changes.outputs.run_root == 'true'
        run: yarn test --maxWorkers=2

  components-package:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Components validation not required for this change
        if: needs.changes.outputs.run_components != 'true'
        run: |
          echo "Components validation skipped: ${{ needs.changes.outputs.reason }}"

      - name: Checkout
        if: needs.changes.outputs.run_components == 'true'
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.run_components == 'true'
        uses: ./.github/actions/setup

      - name: Test components package
        if: needs.changes.outputs.run_components == 'true'
        run: |
          set -o pipefail
          yarn workspace @micrantha/amaryllis-components test --runInBand 2>&1 | tee components-test.log

      - name: Upload components test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: components-test-log
          path: components-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint components package
        if: needs.changes.outputs.run_components == 'true'
        run: |
          set -o pipefail
          yarn eslint "packages/amaryllis-components/src/**/*.{ts,tsx}" 2>&1 | tee components-lint.log

      - name: Upload components lint log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: components-lint-log
          path: components-lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck components package
        if: needs.changes.outputs.run_components == 'true'
        run: yarn workspace @micrantha/amaryllis-components typecheck

      - name: Build components package
        if: needs.changes.outputs.run_components == 'true'
        run: yarn workspace @micrantha/amaryllis-components build

      - name: Verify AI component examples
        if: needs.changes.outputs.run_components == 'true'
        run: yarn workspace @micrantha/amaryllis-components verify:examples

      - name: Build main package for package validation
        if: needs.changes.outputs.run_components == 'true'
        run: yarn prepare

      - name: Validate package metadata and outputs
        if: needs.changes.outputs.run_components == 'true'
        run: node scripts/validate-packages.mjs

      - name: Dry-run components package archive
        if: needs.changes.outputs.run_components == 'true'
        run: npm pack --dry-run
        working-directory: packages/amaryllis-components

      - name: Dry-run main package archive
        if: needs.changes.outputs.run_components == 'true'
        run: npm pack --dry-run

  build-library:
    needs: [changes, components-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Root library build not required for this change
        if: needs.changes.outputs.run_root != 'true'
        run: |
          echo "Root library build skipped: ${{ needs.changes.outputs.reason }}"

      - name: Checkout
        if: needs.changes.outputs.run_root == 'true'
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.run_root == 'true'
        uses: ./.github/actions/setup

      - name: Build main package
        if: needs.changes.outputs.run_root == 'true'
        run: yarn prepare

      - name: Validate package metadata and outputs
        if: needs.changes.outputs.run_root == 'true'
        run: node scripts/validate-packages.mjs

      - name: Dry-run main package archive
        if: needs.changes.outputs.run_root == 'true'
        run: npm pack --dry-run

  build-android:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir=\"${{ env.TURBO_CACHE_DIR }}\" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > example/android/local.properties
        working-directory: ./

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    needs: changes
    if: needs.changes.outputs.run_native == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      XCODE_VERSION: 16.4
      TURBO_CACHE_DIR: .turbo/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir=\"${{ env.TURBO_CACHE_DIR }}\" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods dependencies
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
