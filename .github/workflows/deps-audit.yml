name: Dependency Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 3'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Wait for install-producing workflows on push events
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
          REQUIRED_WORKFLOWS: '["CI","Security - CodeQL"]'
          TIMEOUT_SECONDS: '1800'
          POLL_INTERVAL_SECONDS: '20'
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMs;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });

              const failed = [];
              const pending = [];

              for (const name of required) {
                const matches = runs.filter((run) => run.name === name);
                const successful = matches.find(
                  (run) => run.status === 'completed' && run.conclusion === 'success',
                );

                if (successful) {
                  core.info(`${name}: success (${successful.html_url})`);
                  continue;
                }

                const unsuccessful = matches.find(
                  (run) =>
                    run.status === 'completed' &&
                    !['success', 'skipped', 'neutral'].includes(run.conclusion ?? ''),
                );

                if (unsuccessful) {
                  failed.push(`${name}: ${unsuccessful.conclusion} (${unsuccessful.html_url})`);
                  continue;
                }

                pending.push(name);
              }

              if (failed.length) {
                core.setFailed(`Required workflows failed for ${targetSha}:\n${failed.join('\n')}`);
                return;
              }

              if (!pending.length) {
                core.info(`Required workflows passed for ${targetSha}.`);
                return;
              }

              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out waiting for required workflows on ${targetSha}: ${pending.join(', ')}`,
                );
                return;
              }

              core.info(`Waiting for workflows on ${targetSha}: ${pending.join(', ')}`);
              await sleep(intervalMs);
            }

      - name: Run npm audit and capture output
        id: npm_audit
        continue-on-error: true
        run: |
          set -o pipefail
          yarn npm audit --all --recursive --severity high > audit-output.txt 2>&1

      - name: Build issue body if audit failed
        if: steps.npm_audit.outcome == 'failure'
        run: |
          {
            echo "# Dependency audit failed"
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "## Audit output"
            echo
            echo '```text'
            sed -n '1,400p' audit-output.txt
            echo '```'
          } > audit-issue.md

      - name: Create issue when audit fails
        if: steps.npm_audit.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dependency audit failure (${{ github.run_id }})"
          content-filepath: ./audit-issue.md
          labels: security,dependencies

      - name: Fail job if audit failed
        if: steps.npm_audit.outcome == 'failure'
        run: exit 1
