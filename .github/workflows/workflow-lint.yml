name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: runner-amaryllis

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate project toolchain
        run: |
          set -euo pipefail
          toolchain="$(nix build --no-link --print-out-paths .#ci-toolchain)"
          test -x "$toolchain/bin/actionlint"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Lint workflow files
        run: |
          actionlint \
            -ignore 'label "runner-amaryllis" is unknown' \
            -ignore 'unknown permission scope "artifact-metadata"'
