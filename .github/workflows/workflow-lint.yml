name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: runner-amaryllis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflow files
        run: nix develop .#ci --command actionlint
