name: Canary Publish

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'cpp/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: canary-publish
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for required workflows
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ github.sha }}
          REQUIRED_WORKFLOWS: '["CI","Dependency Audit","Security - CodeQL"]'
          TIMEOUT_SECONDS: '1800'
          POLL_INTERVAL_SECONDS: '20'
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMs;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });

              const failed = [];
              const pending = [];

              for (const name of required) {
                const matches = runs.filter((run) => run.name === name);
                const successful = matches.find(
                  (run) => run.status === 'completed' && run.conclusion === 'success',
                );

                if (successful) {
                  core.info(`${name}: success (${successful.html_url})`);
                  continue;
                }

                const unsuccessful = matches.find(
                  (run) =>
                    run.status === 'completed' &&
                    !['success', 'skipped', 'neutral'].includes(run.conclusion ?? ''),
                );

                if (unsuccessful) {
                  failed.push(`${name}: ${unsuccessful.conclusion} (${unsuccessful.html_url})`);
                  continue;
                }

                pending.push(name);
              }

              if (failed.length) {
                core.setFailed(`Required workflows failed for ${targetSha}:\n${failed.join('\n')}`);
                return;
              }

              if (!pending.length) {
                core.info(`Required workflows passed for ${targetSha}.`);
                return;
              }

              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out waiting for required workflows on ${targetSha}: ${pending.join(', ')}`,
                );
                return;
              }

              core.info(`Waiting for workflows on ${targetSha}: ${pending.join(', ')}`);
              await sleep(intervalMs);
            }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run quality checks
        run: |
          yarn lint
          yarn typecheck
          yarn test --maxWorkers=2

      - name: Build package
        run: yarn prepare

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Compute canary version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          CANARY_VERSION="${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          echo "CANARY_VERSION=${CANARY_VERSION}" >> "$GITHUB_ENV"
          npm version --no-git-tag-version "$CANARY_VERSION"

      - name: Publish canary package
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: npm publish --tag canary --provenance --access public
