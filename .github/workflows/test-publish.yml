name: Test Publish Workflow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no publishing)'
        required: false
        default: 'true'
      test_version:
        description: 'Version to test'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/

      - name: Run main library tests
        run: npm test

      - name: Lint main library
        run: yarn lint --ignore-pattern 'packages/amaryllis-components/**'

      - name: Typecheck main library
        run: npm run typecheck

      - name: Build main library
        run: yarn prepare

      - name: Run components library tests
        run: npm test -- --runInBand
        working-directory: packages/amaryllis-components

      - name: Lint components library
        run: yarn eslint "packages/amaryllis-components/src/**/*.{ts,tsx}"

      - name: Typecheck components library
        run: npm run typecheck
        working-directory: packages/amaryllis-components

      - name: Build components library
        run: npm run build
        working-directory: packages/amaryllis-components

      - name: Validate package metadata and outputs
        run: node scripts/validate-packages.mjs

      - name: Test components library npm pack command (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm pack --dry-run
        working-directory: packages/amaryllis-components

      - name: Test main library npm pack command (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm pack --dry-run

      - name: Test npm publish (simulation)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Simulating npm publish"
          echo "Main package: @micrantha/react-native-amaryllis"
          echo "Components package: @micrantha/amaryllis-components"
          echo "Registry: https://registry.npmjs.org/"
          echo "Provenance: Would be generated automatically"
          echo "GitHub Release: Would upload package tarballs"
          echo "Publish simulation complete"
