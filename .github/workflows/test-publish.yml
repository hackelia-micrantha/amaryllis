name: Test Publish Workflow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no publishing)'
        required: false
        default: 'true'
      test_version:
        description: 'Version to test'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/

      - name: Run tests
        run: npm test

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

      - name: Build package
        run: yarn prepare

      - name: Run components library tests
        run: npm test -- --runInBand
        working-directory: packages/amaryllis-components

      - name: Lint components library
        run: npm run lint
        working-directory: packages/amaryllis-components

      - name: Typecheck components library
        run: npm run typecheck
        working-directory: packages/amaryllis-components

      - name: Build components library
        run: npm run build
        working-directory: packages/amaryllis-components

      - name: Validate packages
        run: |
          echo "Package validation"
          node -e "console.log('Main package:', JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).name)"
          node -e "console.log('Main version:', JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version)"
          test -d lib
          ls -la lib/
          node -e "console.log('Components package:', JSON.parse(require('fs').readFileSync('./packages/amaryllis-components/package.json', 'utf8')).name)"
          node -e "console.log('Components version:', JSON.parse(require('fs').readFileSync('./packages/amaryllis-components/package.json', 'utf8')).version)"
          test -d packages/amaryllis-components/dist
          ls -la packages/amaryllis-components/dist/

      - name: Test components library npm pack command (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Testing components package publish preparation"
          npm pack --dry-run
        working-directory: packages/amaryllis-components

      - name: Test main library npm pack command (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Testing main package publish preparation"
          npm pack --dry-run
          echo "npm pack dry run successful"

      - name: Test npm publish (simulation)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Simulating npm publish"
          echo "Main package: @micrantha/react-native-amaryllis"
          echo "Components package: @micrantha/amaryllis-components"
          echo "Registry: https://registry.npmjs.org/"
          echo "Provenance: Would be generated automatically"
          echo "GitHub Release: Would upload package tarballs"
          echo "Publish simulation complete"
