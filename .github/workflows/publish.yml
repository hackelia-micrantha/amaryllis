name: Publish Packages

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  preflight:
    runs-on: runner-amaryllis
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tagged commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup project toolchain
        uses: ./.github/actions/setup

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$TAG_NAME"

      - name: Wait for required workflows
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUIRED_WORKFLOWS: '["CI","Dependency Audit","Security - CodeQL"]'
          TIMEOUT_SECONDS: '1800'
          POLL_INTERVAL_SECONDS: '20'
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMs;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });
              const failed = [];
              const pending = [];

              for (const name of required) {
                const matches = runs.filter((run) => run.name === name);
                const successful = matches.find(
                  (run) => run.status === 'completed' && run.conclusion === 'success'
                );
                if (successful) continue;

                const unsuccessful = matches.find(
                  (run) =>
                    run.status === 'completed' &&
                    !['success', 'skipped', 'neutral'].includes(run.conclusion ?? '')
                );
                if (unsuccessful) {
                  failed.push(`${name}: ${unsuccessful.conclusion} (${unsuccessful.html_url})`);
                } else {
                  pending.push(name);
                }
              }

              if (failed.length) {
                core.setFailed(`Required workflows failed for ${targetSha}:\n${failed.join('\n')}`);
                return;
              }
              if (!pending.length) return;
              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out waiting for required workflows on ${targetSha}: ${pending.join(', ')}`
                );
                return;
              }
              core.info(`Waiting for workflows on ${targetSha}: ${pending.join(', ')}`);
              await sleep(intervalMs);
            }

      - name: Run main library tests
        run: yarn test --maxWorkers=2

      - name: Lint main library
        run: yarn lint --ignore-pattern 'packages/amaryllis-components/**'

      - name: Typecheck main library
        run: yarn typecheck

      - name: Test package release contracts
        run: node --test scripts/package-release.test.mjs

      - name: Typecheck core package
        run: yarn workspace @micrantha/amaryllis typecheck

      - name: Build core package
        run: yarn workspace @micrantha/amaryllis build

      - name: Build main package
        run: yarn prepare

      - name: Run components library tests
        run: yarn workspace @micrantha/amaryllis-components test --runInBand

      - name: Lint components library
        run: yarn eslint "packages/amaryllis-components/src/**/*.{ts,tsx}"

      - name: Typecheck components library
        run: yarn workspace @micrantha/amaryllis-components typecheck

      - name: Build components library
        run: yarn workspace @micrantha/amaryllis-components build

      - name: Validate package metadata and outputs
        run: node scripts/validate-packages.mjs

      - name: Pack and verify exact release artifacts
        run: node scripts/package-preflight.mjs --output-dir release-artifacts

      - name: Upload preflighted release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-${{ steps.target.outputs.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/package-release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout publish scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup hosted Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Resolve tagged commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download exact preflighted artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packages-${{ steps.target.outputs.sha }}
          path: release-artifacts

      - name: Publish exact tarballs in dependency order
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          node scripts/publish-package-artifacts.mjs \
            --manifest release-artifacts/package-release.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/*.tgz --clobber
            gh release edit "$TAG_NAME" --draft=false --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" release-artifacts/*.tgz --title "$TAG_NAME" --generate-notes --verify-tag
          fi
