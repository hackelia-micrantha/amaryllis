name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for required workflows
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
          REQUIRED_WORKFLOWS: '["CI","Dependency Audit","Security - CodeQL"]'
          TIMEOUT_SECONDS: '1800'
          POLL_INTERVAL_SECONDS: '20'
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMs;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });

              const failed = [];
              const pending = [];

              for (const name of required) {
                const matches = runs.filter((run) => run.name === name);
                const successful = matches.find(
                  (run) => run.status === 'completed' && run.conclusion === 'success',
                );

                if (successful) {
                  core.info(`${name}: success (${successful.html_url})`);
                  continue;
                }

                const unsuccessful = matches.find(
                  (run) =>
                    run.status === 'completed' &&
                    !['success', 'skipped', 'neutral'].includes(run.conclusion ?? ''),
                );

                if (unsuccessful) {
                  failed.push(`${name}: ${unsuccessful.conclusion} (${unsuccessful.html_url})`);
                  continue;
                }

                pending.push(name);
              }

              if (failed.length) {
                core.setFailed(`Required workflows failed for ${targetSha}:\n${failed.join('\n')}`);
                return;
              }

              if (!pending.length) {
                core.info(`Required workflows passed for ${targetSha}.`);
                return;
              }

              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out waiting for required workflows on ${targetSha}: ${pending.join(', ')}`,
                );
                return;
              }

              core.info(`Waiting for workflows on ${targetSha}: ${pending.join(', ')}`);
              await sleep(intervalMs);
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Run tests
        run: npm test

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

      - name: Build package
        run: yarn prepare

      - name: Validate package
        run: |
          echo "📦 Package validation before publishing"
          node -e "console.log('✓ Package name:', JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).name)"
          node -e "console.log('✓ Version:', JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version)"
          echo "✓ Built files:"
          ls -la lib/
          echo "✓ Package validation complete"

      - name: Check authentication context
        run: |
          echo "🔐 Checking authentication context"
          npm config get registry
          echo "OIDC does not expose an npm token to npm config"
          env | grep -E "(NPM_|GITHUB_|NODE_AUTH_TOKEN)" || echo "No relevant environment variables found"

      - name: Detect npm auth token presence (non-sensitive)
        run: |
          node -e "console.log(process.env.NODE_AUTH_TOKEN ? 'NODE_AUTH_TOKEN is set' : 'NODE_AUTH_TOKEN is not set')"
          node -e "console.log(process.env.NPM_TOKEN ? 'NPM_TOKEN is set' : 'NPM_TOKEN is not set')"

      - name: Ensure npm auth is OIDC-only
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f ~/.npmrc

      - name: Publish to npm (OIDC)
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          echo "🚀 Publishing with OIDC trusted publisher"
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          npm publish --provenance --access public
