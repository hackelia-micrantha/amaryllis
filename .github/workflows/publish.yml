name: Publish Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for required workflows
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ github.sha }}
          REQUIRED_WORKFLOWS: '["CI","Dependency Audit","Security - CodeQL"]'
          TIMEOUT_SECONDS: '1800'
          POLL_INTERVAL_SECONDS: '20'
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const required = JSON.parse(process.env.REQUIRED_WORKFLOWS);
            const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
            const intervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + timeoutMs;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: targetSha,
                per_page: 100,
              });

              const failed = [];
              const pending = [];

              for (const name of required) {
                const matches = runs.filter((run) => run.name === name);
                const successful = matches.find(
                  (run) => run.status === 'completed' && run.conclusion === 'success',
                );

                if (successful) {
                  core.info(`${name}: success (${successful.html_url})`);
                  continue;
                }

                const unsuccessful = matches.find(
                  (run) =>
                    run.status === 'completed' &&
                    !['success', 'skipped', 'neutral'].includes(run.conclusion ?? ''),
                );

                if (unsuccessful) {
                  failed.push(`${name}: ${unsuccessful.conclusion} (${unsuccessful.html_url})`);
                  continue;
                }

                pending.push(name);
              }

              if (failed.length) {
                core.setFailed(`Required workflows failed for ${targetSha}:\n${failed.join('\n')}`);
                return;
              }

              if (!pending.length) {
                core.info(`Required workflows passed for ${targetSha}.`);
                return;
              }

              if (Date.now() >= deadline) {
                core.setFailed(
                  `Timed out waiting for required workflows on ${targetSha}: ${pending.join(', ')}`,
                );
                return;
              }

              core.info(`Waiting for workflows on ${targetSha}: ${pending.join(', ')}`);
              await sleep(intervalMs);
            }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Run main library tests
        run: npm test

      - name: Lint main library
        run: npm run lint

      - name: Typecheck main library
        run: npm run typecheck

      - name: Build main library
        run: yarn prepare

      - name: Run components library tests
        run: npm test -- --runInBand
        working-directory: packages/amaryllis-components

      - name: Lint components library
        run: npm run lint
        working-directory: packages/amaryllis-components

      - name: Typecheck components library
        run: npm run typecheck
        working-directory: packages/amaryllis-components

      - name: Build components library
        run: npm run build
        working-directory: packages/amaryllis-components

      - name: Validate package metadata and outputs
        run: node scripts/validate-packages.mjs

      - name: Prepare GitHub release assets directory
        run: mkdir -p release-artifacts

      - name: Pack main library GitHub release asset
        run: npm pack --json --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      - name: Pack components library GitHub release asset
        run: npm pack --json --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
        working-directory: packages/amaryllis-components

      - name: Check authentication context
        run: |
          echo "Checking authentication context"
          npm config get registry
          echo "OIDC does not expose an npm token to npm config"
          env | grep -E "(NPM_|GITHUB_|NODE_AUTH_TOKEN)" || echo "No relevant environment variables found"

      - name: Detect npm auth token presence (non-sensitive)
        run: |
          node -e "console.log(process.env.NODE_AUTH_TOKEN ? 'NODE_AUTH_TOKEN is set' : 'NODE_AUTH_TOKEN is not set')"
          node -e "console.log(process.env.NPM_TOKEN ? 'NPM_TOKEN is set' : 'NPM_TOKEN is not set')"

      - name: Ensure npm auth is OIDC-only
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f ~/.npmrc

      - name: Publish to npm (OIDC)
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: |
          echo "Publishing main library with OIDC trusted publisher"
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          npm publish --provenance --access public

      - name: Publish components library to npm (OIDC)
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --provenance --access public
        working-directory: packages/amaryllis-components

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/*.tgz --clobber
            gh release edit "$TAG_NAME" --draft=false --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" release-artifacts/*.tgz --title "$TAG_NAME" --generate-notes --verify-tag
          fi
