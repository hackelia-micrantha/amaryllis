name: Diagnose PR 63

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Capture lint output
        continue-on-error: true
        run: yarn lint --ignore-pattern 'packages/amaryllis-components/**' > lint.log 2>&1

      - name: Capture test output
        continue-on-error: true
        run: yarn test --runInBand > test.log 2>&1

      - name: Capture library build output
        continue-on-error: true
        run: yarn prepare > prepare.log 2>&1

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr63-diagnostics
          path: |
            lint.log
            test.log
            prepare.log
          if-no-files-found: error
          retention-days: 1
