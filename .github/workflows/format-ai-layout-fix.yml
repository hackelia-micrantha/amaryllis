name: Normalize AI layout fix files

on:
  push:
    branches:
      - fix/ai-layout-sanitization

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-layout-sanitization

      - name: Restore final newlines and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('packages/amaryllis-components/src/__tests__/UnsafeLayout.test.ts'),
              Path('packages/amaryllis-components/src/generator/react.ts'),
              Path('packages/amaryllis-components/src/schema/spec.schema.ts'),
          ]
          for path in paths:
              content = path.read_bytes().rstrip(b'\n') + b'\n'
              path.write_bytes(content)
          Path('.github/workflows/format-ai-layout-fix.yml').unlink()
          PY

      - name: Commit normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/amaryllis-components/src/__tests__/UnsafeLayout.test.ts \
            packages/amaryllis-components/src/generator/react.ts \
            packages/amaryllis-components/src/schema/spec.schema.ts \
            .github/workflows/format-ai-layout-fix.yml
          git commit -m "style: normalize layout sanitizer files"
          git push origin HEAD:fix/ai-layout-sanitization
