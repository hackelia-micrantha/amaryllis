name: Diagnose PR 63 Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Capture test output
        continue-on-error: true
        run: yarn test --runInBand > test.log 2>&1

      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: pr63-test-diagnostic
          path: test.log
          if-no-files-found: error
          retention-days: 1
