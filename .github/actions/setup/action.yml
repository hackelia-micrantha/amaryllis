name: Setup
description: Activate the project-owned Nix toolchain and install dependencies

inputs:
  registry-url:
    description: Optional npm registry URL retained for caller compatibility
    required: false
    default: https://registry.npmjs.org/
  activate-nix-toolchain:
    description: Activate the repository Nix toolchain; disable only after an explicit hosted-native Node bootstrap
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Validate project toolchain
      if: inputs.activate-nix-toolchain == 'true'
      run: nix flake check
      shell: bash

    - name: Activate project toolchain
      if: inputs.activate-nix-toolchain == 'true'
      run: |
        set -euo pipefail
        toolchain="$(nix build --no-link --print-out-paths .#ci-toolchain)"
        test -x "$toolchain/bin/node"
        test -x "$toolchain/bin/yarn"
        printf '%s\n' "$toolchain/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Install dependencies with project toolchain
      if: inputs.activate-nix-toolchain == 'true'
      run: yarn install --immutable
      shell: bash

    - name: Install dependencies with hosted native Node
      if: inputs.activate-nix-toolchain != 'true'
      run: node .yarn/releases/yarn-3.6.1.cjs install --immutable
      shell: bash
