name: Setup
description: Activate the project-owned Nix toolchain and install dependencies

inputs:
  registry-url:
    description: Optional npm registry URL for publish-validation workflows
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate project toolchain
      run: nix flake check
      shell: bash

    - name: Activate project toolchain
      run: |
        set -euo pipefail
        toolchain="$(nix build --no-link --print-out-paths .#ci-toolchain)"
        test -x "$toolchain/bin/node"
        test -x "$toolchain/bin/yarn"
        printf '%s\n' "$toolchain/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Configure npm registry
      if: inputs.registry-url != ''
      run: npm config set registry "${{ inputs.registry-url }}"
      shell: bash

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
