buildscript {
  ext {
    getExtOrDefault = {name ->
      return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Amaryllis_' + name]
    }
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Amaryllis_" + name]).toInteger()
}

android {
  namespace "com.micrantha.amaryllis"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  // MediaPipe tasks-genai 0.10.24 contains JVM classes compiled for Java 21.
  // Keep Android/library bytecode compatibility at Java 8, but run host-side
  // unit tests with a Java 21 launcher so those upstream classes can load.
  testOptions {
    unitTests.all {
      javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
      }
    }
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation 'com.google.mediapipe:tasks-genai:0.10.24'
  // Google did not publish tasks-core:0.10.24. Core 0.10.21 supplies
  // MPImage/BitmapImageBuilder referenced by GenAI; retain exact pins and
  // verify the resolved Android compile/runtime artifacts before release.
  implementation 'com.google.mediapipe:tasks-core:0.10.21'

  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
  testImplementation 'junit:junit:4.13.2'
}
