apiVersion: amaryllis/v1alpha1
kind: ComponentSpec

metadata:
  name: context-summary-card
  version: 1.0.0
  owner: amaryllis-example
  stability: experimental

target:
  framework: react
  runtime: rn

props:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
  required:
    - title
    - description

ui:
  layout: |
    <View style={styles.card}>
      <Text style={styles.eyebrow}>AI component</Text>
      <Text style={styles.title}>{title}</Text>
      <Text style={styles.description}>{description}</Text>
    </View>
  variants:
    compact:
      layout: |
        <View style={[styles.card, styles.compactCard]}>
          <Text style={styles.eyebrow}>AI component</Text>
          <Text style={styles.title}>{title}</Text>
          <Text style={styles.description}>{description}</Text>
        </View>

ai:
  mode: personalize
  execution: device
  generationContract:
    output: props-json
